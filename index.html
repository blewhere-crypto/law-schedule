<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>일정관리 · 변호사 대시보드</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#1e3a5f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="일정관리" />
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #1e3a5f;
    --navy-dark: #142943;
    --bg: #f2f4f7;
    --card: #ffffff;
    --border: #e2e6ec;
    --text: #1f2937;
    --text-muted: #6b7280;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --ok: #16a34a;
    --type-변론기일: #2563eb;
    --type-선고기일: #7c3aed;
    --type-조정기일: #0d9488;
    --type-준비기일: #0284c7;
    --type-서면제출: #dc2626;
    --type-기타: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 22px;
    margin: 0;
    color: var(--navy-dark);
  }
  header .today-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-primary {
    background: var(--navy);
    color: #fff;
  }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-ghost {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-ghost:hover { background: #eef1f5; }
  .btn-icon {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .btn-icon:hover { background: #eef1f5; color: var(--text); }
  .btn-icon.naver-btn { font-weight: 800; font-size: 12px; color: #03c75a; border: 1px solid #cdefdb; }
  .btn-icon.naver-btn:hover { background: #e9fbf1; }
  .btn-icon.naver-btn.synced { background: #03c75a; color: #fff; border-color: #03c75a; }
  .btn-icon.naver-btn.synced:hover { background: #02a94c; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 8px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-header h2 {
    font-size: 15px;
    margin: 0;
    color: var(--navy-dark);
  }
  .toggle-label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  /* 대시보드 요약 */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .stat-tile:hover { border-color: var(--navy); }
  .stat-tile.active { border-color: var(--navy); border-width: 2px; background: #eef2f7; }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--navy-dark); line-height: 1.1; }
  .stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-weight: 600; }
  .stat-tile.accent-today .stat-num { color: var(--danger); }
  .stat-tile.accent-week .stat-num { color: var(--warn); }
  .stat-tile.accent-overdue { background: var(--danger-bg); border-color: #fecaca; }
  .stat-tile.accent-overdue .stat-num { color: var(--danger); }
  .stat-tile.accent-overdue.active { background: var(--danger-bg); border-color: var(--danger); }
  .stat-tile.accent-case .stat-num { color: var(--type-조정기일); }
  .filter-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 3px 10px;
    margin-left: 6px;
    cursor: pointer;
    vertical-align: middle;
  }
  @media (max-width: 480px) {
    .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* 탭 */
  .view-tabs { display: flex; gap: 6px; }
  .tab-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 100px;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* 이벤트 목록 (공통) */
  #urgentList, .case-group-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #urgentList { max-height: 360px; overflow-y: auto; padding-bottom: 10px; }
  .empty-msg {
    color: var(--text-muted);
    font-size: 13px;
    padding: 24px 4px;
    text-align: center;
  }
  .event-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: #fafbfc;
  }
  .event-row.overdue { background: var(--danger-bg); border-color: #fecaca; }
  .event-row.soon { background: var(--warn-bg); border-color: #fde68a; }
  .event-row.done { opacity: 0.55; }
  .dday-badge {
    flex: 0 0 auto;
    min-width: 52px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 6px;
    border-radius: 6px;
    background: var(--navy);
    color: #fff;
  }
  .event-row.overdue .dday-badge { background: var(--danger); }
  .event-row.soon .dday-badge { background: var(--warn); }
  .type-badge {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 100px;
    color: #fff;
    white-space: nowrap;
  }
  .event-main { flex: 1 1 auto; min-width: 0; }
  .event-case {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
  input[type="checkbox"].done-check {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--ok);
  }

  /* 캘린더 */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 10px;
  }
  .cal-nav .month-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy-dark);
    min-width: 96px;
    text-align: center;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    margin-top: 4px;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 0 8px;
    font-weight: 600;
  }
  .cal-cell {
    min-height: 78px;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 5px 4px;
    cursor: pointer;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cal-cell:hover { background: #f7f9fb; }
  .cal-cell.other-month { background: #fafafa; color: #c3c8d0; }
  .cal-cell.today { border-color: var(--navy); border-width: 2px; }
  .cal-cell.holiday .cal-date-num, .cal-cell.sunday .cal-date-num { color: var(--danger); }
  .cal-dow.sun { color: var(--danger); }
  .cal-date-num { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .holiday-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--danger);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-chip {
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-more { font-size: 10px; color: var(--text-muted); padding-left: 2px; }

  /* 사건별 보기 */
  #caseSearchInput {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    font-family: inherit;
  }
  .case-group {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .case-group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f7f9fb;
    padding: 10px 12px;
    flex-wrap: wrap;
    gap: 6px;
    cursor: pointer;
  }
  .case-group-toggle {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    padding: 2px 4px;
    transition: transform 0.15s;
  }
  .case-group.collapsed .case-group-toggle { transform: rotate(-90deg); }
  .case-group.collapsed .case-group-list { display: none; }
  .case-group-number { font-weight: 700; font-size: 13.5px; color: var(--navy-dark); }
  .case-group-title { font-size: 12.5px; color: var(--text-muted); margin-left: 4px; }
  .case-group-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .case-group-list { padding: 10px 12px; }

  /* 로그인 화면 */
  #authOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #authOverlay.open { display: flex; }
  .auth-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 360px;
    padding: 28px 24px;
  }
  .auth-box h1 {
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--navy-dark);
  }
  .auth-box .auth-sub {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  .auth-msg {
    font-size: 12.5px;
    margin-bottom: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    display: none;
  }
  .auth-msg.error { display: block; color: var(--danger); background: var(--danger-bg); }
  .auth-msg.info { display: block; color: var(--navy-dark); background: #eef2f7; }
  .header-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-user .user-email {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 모달 */
  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  #modalOverlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin: 0 0 16px; font-size: 17px; color: var(--navy-dark); }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="time"],
  .field select,
  .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  .field select { max-height: 200px; }
  .field textarea { resize: vertical; min-height: 56px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .field-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  .date-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .date-row input[type="date"] {
    flex: 1.3;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .date-row input[type="time"] {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .date-row .remove-row-btn { flex: 0 0 auto; font-size: 18px; line-height: 1; }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 8px;
  }
  .modal-actions .right { display: flex; gap: 8px; }

  #dayModal .day-event-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

  @media (max-width: 560px) {
    .cal-cell { min-height: 60px; }
    .cal-chip { display: none; }
    .cal-cell.has-events::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--navy);
      align-self: center;
    }
    .event-row { flex-wrap: wrap; row-gap: 6px; }
    .event-actions { margin-left: auto; }
    .event-main { flex-basis: 100%; }
    .event-case, .event-sub { white-space: normal; }
  }
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-box">
    <h1>일정관리 로그인</h1>
    <div class="auth-sub">본인만 사용하는 개인 계정입니다. 여러 기기에서 같은 계정으로 로그인하면 일정이 동기화됩니다.</div>
    <div id="authMsg" class="auth-msg"></div>
    <div class="field">
      <label for="authEmail">이메일</label>
      <input type="text" id="authEmail" placeholder="you@example.com" autocomplete="username" />
    </div>
    <div class="field">
      <label for="authPassword">비밀번호</label>
      <input type="password" id="authPassword" placeholder="6자 이상" autocomplete="current-password" />
    </div>
    <div style="display:flex; gap:8px; margin-top:4px;">
      <button type="button" class="btn-ghost" id="authSignupBtn" style="flex:1;padding:10px;font-weight:600;">회원가입</button>
      <button type="button" class="btn-primary btn" id="authLoginBtn" style="flex:1;">로그인</button>
    </div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <header>
    <div>
      <h1>일정관리</h1>
      <div class="today-label" id="todayLabel"></div>
    </div>
    <div class="header-user">
      <span class="user-email" id="userEmailLabel"></span>
      <button class="btn-ghost" id="naverConnectBtn" style="padding:6px 10px;font-size:12px;">네이버 캘린더 연결</button>
      <button class="btn-ghost" id="logoutBtn" style="padding:6px 10px;font-size:12px;">로그아웃</button>
      <button class="btn btn-primary" id="addBtn">+ 일정 추가</button>
    </div>
  </header>

  <div class="stats-row" id="statsRow">
    <div class="stat-tile" id="statTileTotal" data-filter="all">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">전체 일정</div>
    </div>
    <div class="stat-tile accent-today" id="statTileToday" data-filter="today">
      <div class="stat-num" id="statToday">0</div>
      <div class="stat-label">오늘 할 일</div>
    </div>
    <div class="stat-tile accent-week" id="statTileWeek" data-filter="week">
      <div class="stat-num" id="statWeek">0</div>
      <div class="stat-label">1주일 이내</div>
    </div>
    <div class="stat-tile accent-overdue" id="statTileOverdue" data-filter="overdue">
      <div class="stat-num" id="statOverdue">0</div>
      <div class="stat-label">일정 경과</div>
    </div>
    <div class="stat-tile accent-case" id="statTileCases">
      <div class="stat-num" id="statCases">0</div>
      <div class="stat-label">진행 사건수</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>중요 일정 <button type="button" id="urgentFilterBadge" class="filter-badge" style="display:none;"></button></h2>
      <label class="toggle-label">
        <input type="checkbox" id="showDoneToggle" />
        완료된 일정도 보기
      </label>
    </div>
    <div id="urgentList"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>일정 보기</h2>
      <div class="view-tabs">
        <button type="button" class="tab-btn active" id="tabCalendar">캘린더</button>
        <button type="button" class="tab-btn" id="tabByCase">사건별(의뢰인)</button>
      </div>
    </div>

    <div id="calendarView">
      <div class="cal-nav">
        <button class="btn-icon" id="prevMonth">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="btn-icon" id="nextMonth">›</button>
        <button class="btn-ghost" id="todayBtn" style="padding:6px 10px;font-size:12px;">오늘</button>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid" style="margin-bottom:14px;"></div>
    </div>

    <div id="caseView" style="display:none;">
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input type="text" id="caseSearchInput" placeholder="의뢰인명 또는 사건명으로 검색" style="flex:1; margin-bottom:0;" />
        <button type="button" class="btn-ghost" id="toggleAllCasesBtn" style="font-size:12px; padding:8px 12px; white-space:nowrap;">모두 접기</button>
      </div>
      <div id="caseGroupList"></div>
    </div>
  </div>
</div>

<!-- 일정 추가/수정 모달 -->
<div id="modalOverlay">
  <div class="modal" id="formModal">
    <h3 id="formTitle">일정 추가</h3>
    <form id="eventForm">
      <input type="hidden" id="eventId" />
      <div class="field" id="caseNumberPickerField">
        <label for="caseNumberPicker">기존 사건에서 선택 (선택사항)</label>
        <select id="caseNumberPicker">
          <option value="">직접 입력 (신규 사건)</option>
        </select>
        <div class="field-hint">선택하면 아래 사건 구분과 법원이 자동으로 채워집니다.</div>
      </div>
      <div class="field">
        <label for="caseNumber">사건 구분 (의뢰인명(사건명))</label>
        <input type="text" id="caseNumber" placeholder="예) 홍길동(손해배상)" required />
      </div>
      <div class="field">
        <label for="eventType">일정유형</label>
        <input type="text" id="eventType" list="typeOptions" placeholder="예) 변론기일" required />

(function () {

  async function refreshEventsFromServer() {

    renderAll();

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function parseDate(s) {
    var parts = s.split("-");
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }
  function diffDaysFromToday(dateStr) {
    var today = parseDate(todayStr());
    var target = parseDate(dateStr);
    return Math.round((target - today) / 86400000);
  }
  function ddayLabel(diff) {
    if (diff === 0) return "D-DAY";
    if (diff > 0) return "D-" + diff;
    return "D+" + (-diff);
  }
  function formatDateHuman(dateStr) {
    var d = parseDate(dateStr);
    var dows = ["일", "월", "화", "수", "목", "금", "토"];
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + dows[d.getDay()] + ")";
  }
  function escapeHtml(s) {
    if (!s) return "";
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // 사건번호/사건명이 분리되어 있던 이전 데이터도 "의뢰인명(사건명)" 형태로 통일해서 보여줌
  function formatCaseLabel(ev) {
    return ev.caseTitle ? ev.caseNumber + "(" + ev.caseTitle + ")" : ev.caseNumber;
  }

  function renderTodayLabel() {
    var d = new Date();
    var dows = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("todayLabel").textContent =
      d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + dows[d.getDay()] + ") 오늘";
  }

  // ---------- 이벤트 행 (공통 렌더러) ----------
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function escapeICSText(s) {
    return (s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }

  // 네이버 캘린더 API(createSchedule)가 요구하는 iCalendar 포맷 (VTIMEZONE 포함, 로컬시각)
  function buildNaverICS(ev) {
    var parts = ev.date.split("-").map(Number);
    var y = parts[0], m = parts[1], d = parts[2];
    var time = ev.time ? ev.time.split(":").map(Number) : [9, 0]; // 시간 미지정 시 오전 9시로 기본 등록
    var startLocal = "" + y + pad2(m) + pad2(d) + "T" + pad2(time[0]) + pad2(time[1]) + "00";
    var endD = new Date(y, m - 1, d, time[0] + 1, time[1]);
    var endLocal = endD.getFullYear() + pad2(endD.getMonth() + 1) + pad2(endD.getDate()) +
      "T" + pad2(endD.getHours()) + pad2(endD.getMinutes()) + "00";
    var nowUTC = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

    var lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:Naver Calendar",
      "CALSCALE:GREGORIAN",
      "BEGIN:VTIMEZONE",
      "TZID:Asia/Seoul",
      "BEGIN:STANDARD",
      "DTSTART:19700101T000000",
      "TZNAME:GMT+09:00",
      "TZOFFSETFROM:+0900",
      "TZOFFSETTO:+0900",
      "END:STANDARD",
      "END:VTIMEZONE",
      "BEGIN:VEVENT",
      "SEQUENCE:0",
      "CLASS:PUBLIC",
      "TRANSP:OPAQUE",
      "UID:" + ev.id + "-law-schedule",
      "DTSTART;TZID=Asia/Seoul:" + startLocal,
      "DTEND;TZID=Asia/Seoul:" + endLocal,
      "SUMMARY:" + escapeICSText(formatCaseLabel(ev) + " - " + ev.type),
    ];
    if (ev.court) lines.push("LOCATION:" + escapeICSText(ev.court));
    if (ev.memo) lines.push("DESCRIPTION:" + escapeICSText(ev.memo));
    lines.push("CREATED:" + nowUTC);
    lines.push("LAST-MODIFIED:" + nowUTC);
    lines.push("DTSTAMP:" + nowUTC);
    lines.push("END:VEVENT");
    lines.push("END:VCALENDAR");
    return lines.join("\n");
  }

  // ---------- 네이버 캘린더 연동 (OAuth + Edge Function) ----------
  function naverRedirectUri() {
    return new URL("naver-callback.html", window.location.href).href;
  }

  function startNaverConnect() {
    var state = Date.now().toString(36) + Math.random().toString(36).slice(2);
    sessionStorage.setItem("naverOAuthState", state);
    var authUrl = "https://nid.naver.com/oauth2.0/authorize?response_type=code" +
      "&client_id=" + encodeURIComponent(NAVER_CLIENT_ID) +
      "&redirect_uri=" + encodeURIComponent(naverRedirectUri()) +
      "&state=" + encodeURIComponent(state);
    window.open(authUrl, "naverLogin", "width=480,height=640");
  }

  function updateNaverConnectBtn(connected) {
    var btn = document.getElementById("naverConnectBtn");
    btn.textContent = connected ? "네이버 캘린더 연결됨 (해제)" : "네이버 캘린더 연결";
    btn.dataset.connected = connected ? "1" : "";
  }

  async function refreshNaverStatus() {
    try {
      var res = await sb.functions.invoke("super-endpoint", { body: { action: "status" } });
      updateNaverConnectBtn(!!(res.data && res.data.connected));
    } catch (e) {
      updateNaverConnectBtn(false);
    }
  }

  async function addEventToNaverCalendar(ev, btnEl) {
    if (ev.naverSyncedAt) {
      var proceed = confirm("이미 네이버 캘린더에 등록된 일정입니다 (" + ev.naverSyncedAt.slice(0, 10) + " 등록).\n다시 등록할까요?");
      if (!proceed) return;
    }
    if (btnEl) btnEl.disabled = true;
    try {
      var res = await sb.functions.invoke("super-endpoint", {
        body: { action: "createSchedule", icalString: buildNaverICS(ev) },
      });
      if (res.error || (res.data && res.data.error)) {
        var msg = (res.data && res.data.error) || (res.error && res.error.message) || "알 수 없는 오류";
        alert("네이버 캘린더 등록 실패: " + msg);
        return;
      }
      var updateRes = await sb.from("events").update({ naver_synced_at: new Date().toISOString() }).eq("id", ev.id);
      if (!updateRes.error) ev.naverSyncedAt = new Date().toISOString();
      renderAll();
      alert("네이버 캘린더에 등록했습니다.");
    } finally {
      if (btnEl) btnEl.disabled = false;
    }
  }

  function buildEventRowEl(ev) {
    var diff = diffDaysFromToday(ev.date);
    var row = document.createElement("div");
    row.className = "event-row";
    if (ev.done) row.className += " done";
    else if (diff < 0) row.className += " overdue";
    else if (diff <= 3) row.className += " soon";

    var primaryText = formatCaseLabel(ev);
    var subParts = [];
    subParts.push(formatDateHuman(ev.date) + (ev.time ? " " + ev.time : ""));
    if (ev.court) subParts.push(ev.court);
    if (ev.memo) subParts.push(ev.memo);

    row.innerHTML =
      '<input type="checkbox" class="done-check" ' + (ev.done ? "checked" : "") + ' />' +
      '<div class="dday-badge">' + ddayLabel(diff) + '</div>' +
      '<div class="type-badge" style="background:' + typeColor(ev.type) + '">' + escapeHtml(ev.type) + '</div>' +
      '<div class="event-main">' +
        '<div class="event-case">' + escapeHtml(primaryText) + '</div>' +
        '<div class="event-sub">' + escapeHtml(subParts.join(" · ")) + '</div>' +
      '</div>' +
      '<div class="event-actions">' +
        '<button type="button" class="btn-icon naver-btn' + (ev.naverSyncedAt ? ' synced' : '') + '" title="' +
          (ev.naverSyncedAt ? '이미 네이버 캘린더에 등록됨 (' + ev.naverSyncedAt.slice(0, 10) + ')' : '네이버 캘린더에 바로 등록') +
          '">N</button>' +
        '<button type="button" class="btn-icon edit-btn" title="수정">✎</button>' +
      '</div>';

    row.style.cursor = "pointer";
    row.addEventListener("click", function () {
      openFormModal({ editId: ev.id });
    });

    row.querySelector(".done-check").addEventListener("click", function (e) { e.stopPropagation(); });
    row.querySelector(".done-check").addEventListener("change", function () {
      toggleDone(ev.id, this.checked);
    });
    row.querySelector(".naver-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      addEventToNaverCalendar(ev, this);
    });
    row.querySelector(".edit-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      openFormModal({ editId: ev.id });
    });
    return row;
  }

  async function toggleDone(id, done) {
    var ev = state.events.find(function (e) { return e.id === id; });
    if (!ev) return;
    ev.done = done;
    renderAll();
    var res = await sb.from("events").update({ done: done }).eq("id", id);
    if (res.error) {
      alert("저장 실패: " + res.error.message);
      ev.done = !done;
      renderAll();
    }
  }

  // ---------- 중요 일정 ----------
  var URGENT_FILTER_LABELS = { today: "오늘 할 일", week: "1주일 이내", overdue: "일정 경과" };

  function setUrgentFilter(f) {
    state.urgentFilter = f;
    renderUrgentList();
    updateStatTileActiveClasses();
  }

  function updateStatTileActiveClasses() {
    ["statTileTotal", "statTileToday", "statTileWeek", "statTileOverdue"].forEach(function (id) {
      var el = document.getElementById(id);
      el.classList.toggle("active", state.urgentFilter === el.getAttribute("data-filter"));
    });
  }

  function renderUrgentList() {
    var list = document.getElementById("urgentList");
    var filter = state.urgentFilter;
    var items;
    if (filter === "today") {
      var today = todayStr();
      items = state.events.filter(function (e) { return !e.done && e.date === today; });
    } else if (filter === "week") {
      items = state.events.filter(function (e) {
        if (e.done) return false;
        var diff = diffDaysFromToday(e.date);
        return diff >= 0 && diff <= 7;
      });
    } else if (filter === "overdue") {
      items = state.events.filter(function (e) { return !e.done && diffDaysFromToday(e.date) < 0; });
    } else {
      items = state.events.filter(function (e) { return state.showDone || !e.done; });
    }
    items.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.time || "").localeCompare(b.time || "");
    });

    var badge = document.getElementById("urgentFilterBadge");
    var showDoneToggleEl = document.getElementById("showDoneToggle");
    if (filter === "all") {
      badge.style.display = "none";
      showDoneToggleEl.disabled = false;
    } else {
      badge.style.display = "inline-flex";
      badge.textContent = URGENT_FILTER_LABELS[filter] + " ✕";
      showDoneToggleEl.disabled = true;
    }

    list.innerHTML = "";
    if (items.length === 0) {
      list.innerHTML = '<div class="empty-msg">' +
        (filter === "all" ? '등록된 일정이 없습니다. 상단의 "+ 일정 추가" 버튼으로 등록해보세요.' : '해당하는 일정이 없습니다.') +
        '</div>';
      return;
    }
    items.forEach(function (ev) { list.appendChild(buildEventRowEl(ev)); });
  }

  };

  function renderCalDow() {
    var el = document.getElementById("calDow");
    el.innerHTML = DOW_LABELS.map(function (d, i) {
      return '<div class="cal-dow' + (i === 0 ? " sun" : "") + '">' + d + '</div>';
    }).join("");
  }

  function renderCalendar() {
    var year = state.calYear, month = state.calMonth;
    document.getElementById("monthLabel").textContent = year + "년 " + (month + 1) + "월";

    var eventsByDate = {};
    state.events.forEach(function (ev) {
      (eventsByDate[ev.date] = eventsByDate[ev.date] || []).push(ev);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startDow = firstOfMonth.getDay();
    var gridStart = new Date(year, month, 1 - startDow);

    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    var todayS = todayStr();

    for (var i = 0; i < 42; i++) {
      var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      var cellDateStr = cellDate.getFullYear() + "-" + pad(cellDate.getMonth() + 1) + "-" + pad(cellDate.getDate());
      var isOtherMonth = cellDate.getMonth() !== month;
      var holidayName = KR_HOLIDAYS[cellDateStr];
      var isSunday = cellDate.getDay() === 0;
      var cell = document.createElement("div");
      cell.className = "cal-cell" + (isOtherMonth ? " other-month" : "") + (cellDateStr === todayS ? " today" : "") +
        (holidayName ? " holiday" : "") + (isSunday ? " sunday" : "");
      cell.setAttribute("data-date", cellDateStr);

      var dayEvents = (eventsByDate[cellDateStr] || []).slice().sort(function (a, b) {
        return (a.time || "").localeCompare(b.time || "");
      });
      if (dayEvents.length > 0) cell.className += " has-events";

      var html = '<div class="cal-date-num">' + cellDate.getDate() + '</div>';
      if (holidayName) {
        html += '<div class="holiday-label" title="' + escapeHtml(holidayName) + '">' + escapeHtml(holidayName) + '</div>';
      }
      var shown = dayEvents.slice(0, 3);
      shown.forEach(function (ev) {
        html += '<div class="cal-chip" style="background:' + typeColor(ev.type) + (ev.done ? ";opacity:.5" : "") + '">' +
          escapeHtml(formatCaseLabel(ev)) + '</div>';
      });
      if (dayEvents.length > 3) {
        html += '<div class="cal-more">+' + (dayEvents.length - 3) + '건 더보기</div>';
      }
      cell.innerHTML = html;
      cell.addEventListener("click", function () { openDayModal(this.getAttribute("data-date")); });
      grid.appendChild(cell);
    }
  }

  function changeMonth(delta) {
    var d = new Date(state.calYear, state.calMonth + delta, 1);
    state.calYear = d.getFullYear();
    state.calMonth = d.getMonth();
    renderCalendar();
  }

  // ---------- 사건별 보기 ----------
  function toggleCaseCollapsed(key) {
    state.collapsedCases[key] = !state.collapsedCases[key];
    renderCaseView();
  }

  function nearestUpcomingDiff(evs) {
    var pending = evs.filter(function (e) { return !e.done; }).map(function (e) { return diffDaysFromToday(e.date); });
    if (pending.length === 0) return null;
    return Math.min.apply(null, pending);
  }

  function getFilteredCaseGroups() {
    var query = document.getElementById("caseSearchInput").value.trim().toLowerCase();
    var groups = {};
    state.events.forEach(function (ev) {
      var key = ev.caseNumber || "(사건번호 없음)";
      (groups[key] = groups[key] || []).push(ev);
    });
    var keys = Object.keys(groups);
    if (query) {
      keys = keys.filter(function (k) {
        var titleMatch = groups[k].some(function (ev) { return (ev.caseTitle || "").toLowerCase().indexOf(query) !== -1; });
        return k.toLowerCase().indexOf(query) !== -1 || titleMatch;
      });
    }
    keys.sort(function (a, b) {
      var na = nearestUpcomingDiff(groups[a]);
      var nb = nearestUpcomingDiff(groups[b]);
      if (na === null && nb === null) return a.localeCompare(b);
      if (na === null) return 1;
      if (nb === null) return -1;
      return na - nb;
    });
    return { groups: groups, keys: keys, query: query };
  }

  function renderCaseView() {
    var found = getFilteredCaseGroups();
    var groups = found.groups, keys = found.keys, query = found.query;

    var container = document.getElementById("caseGroupList");
    container.innerHTML = "";
    if (keys.length === 0) {
      container.innerHTML = '<div class="empty-msg">' + (query ? "검색 결과가 없습니다." : "등록된 사건이 없습니다.") + '</div>';
      return;
    }

    keys.forEach(function (key) {
      var evs = groups[key].slice().sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (a.time || "").localeCompare(b.time || "");
      });
      var titleSample = evs.find(function (e) { return e.caseTitle; });
      var pendingCount = evs.filter(function (e) { return !e.done; }).length;
      var latest = evs[evs.length - 1];
      var groupLabel = formatCaseLabel({ caseNumber: key, caseTitle: titleSample ? titleSample.caseTitle : "" });
      var isCollapsed = !!state.collapsedCases[key];

      var group = document.createElement("div");
      group.className = "case-group" + (isCollapsed ? " collapsed" : "");

      var header = document.createElement("div");
      header.className = "case-group-header";
      header.innerHTML =
        '<div><button type="button" class="case-group-toggle">▾</button><span class="case-group-number">' + escapeHtml(groupLabel) + '</span></div>' +
        '<div class="case-group-meta"><span>진행중 ' + pendingCount + '건</span></div>';
      header.addEventListener("click", function (e) {
        if (e.target.closest("button") && !e.target.closest(".case-group-toggle")) return;
        toggleCaseCollapsed(key);
      });

      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "btn-ghost";
      addBtn.style.cssText = "font-size:11px;padding:4px 10px;";
      addBtn.textContent = "+ 이 사건에 일정 추가";
      addBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        openFormModal({
          caseNumber: groupLabel,
          type: latest.type,
          court: latest.court,
        });
      });
      header.querySelector(".case-group-meta").appendChild(addBtn);

      var listEl = document.createElement("div");
      listEl.className = "case-group-list";
      evs.forEach(function (ev) { listEl.appendChild(buildEventRowEl(ev)); });

      group.appendChild(header);
      group.appendChild(listEl);
      container.appendChild(group);
    });

    var anyExpanded = keys.some(function (k) { return !state.collapsedCases[k]; });
    document.getElementById("toggleAllCasesBtn").textContent = anyExpanded ? "모두 접기" : "모두 펼치기";
  }

  function switchView(view) {
    state.activeView = view;
    var isCal = view === "calendar";
    document.getElementById("calendarView").style.display = isCal ? "" : "none";
    document.getElementById("caseView").style.display = isCal ? "none" : "";
    document.getElementById("tabCalendar").classList.toggle("active", isCal);
    document.getElementById("tabByCase").classList.toggle("active", !isCal);
    if (!isCal) renderCaseView();
  }

  // ---------- 일자별 모달 ----------
  function openDayModal(dateStr) {
    state.dayModalDate = dateStr;
    document.getElementById("dayModalTitle").textContent = formatDateHuman(dateStr) + " 일정";
    var list = document.getElementById("dayEventList");
    var dayEvents = state.events.filter(function (e) { return e.date === dateStr; })
      .sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); });

    list.innerHTML = "";
    if (dayEvents.length === 0) {
      list.innerHTML = '<div class="empty-msg">이 날짜에 등록된 일정이 없습니다.</div>';
    } else {
      dayEvents.forEach(function (ev) { list.appendChild(buildEventRowEl(ev)); });
    }
    document.getElementById("dayModalOverlay").style.display = "flex";
  }
  function closeDayModal() { document.getElementById("dayModalOverlay").style.display = "none"; }

  // ---------- 날짜/시간 다중 입력 행 ----------
  function createDateRow(dateVal, timeVal) {
    var row = document.createElement("div");
    row.className = "date-row";
    row.innerHTML =
      '<input type="date" class="row-date" required />' +
      '<input type="time" class="row-time" />' +
      '<button type="button" class="btn-icon remove-row-btn">×</button>';
    row.querySelector(".row-date").value = dateVal || "";
    row.querySelector(".row-time").value = timeVal || "";
    row.querySelector(".remove-row-btn").addEventListener("click", function () {
      if (document.querySelectorAll("#dateRows .date-row").length > 1) {
        row.remove();
        updateRemoveButtonsVisibility();
      }
    });
    return row;
  }
  function updateRemoveButtonsVisibility() {
    var rows = document.querySelectorAll("#dateRows .date-row");
    rows.forEach(function (r) {
      r.querySelector(".remove-row-btn").style.visibility = rows.length > 1 ? "visible" : "hidden";
    });
  }
  function addDateRow(dateVal, timeVal) {
    document.getElementById("dateRows").appendChild(createDateRow(dateVal, timeVal));
    updateRemoveButtonsVisibility();
  }
  function clearDateRows() { document.getElementById("dateRows").innerHTML = ""; }
  function collectDateRows() {
    var rows = document.querySelectorAll("#dateRows .date-row");
    var result = [];
    rows.forEach(function (r) {
      var d = r.querySelector(".row-date").value;
      var t = r.querySelector(".row-time").value;
      if (d) result.push({ date: d, time: t });
    });
    return result;
  }

  // ---------- 기존 사건 선택 드롭다운 ----------
  function getCaseSummaries() {
    var map = {};
    state.events.forEach(function (ev) {
      if (!ev.caseNumber) return;
      if (!map[ev.caseNumber]) {
        map[ev.caseNumber] = { caseNumber: ev.caseNumber, caseTitle: ev.caseTitle || "", court: ev.court || "" };
      } else if (!map[ev.caseNumber].caseTitle && ev.caseTitle) {
        map[ev.caseNumber].caseTitle = ev.caseTitle;
      }
    });
    return Object.keys(map).sort(function (a, b) { return a.localeCompare(b); }).map(function (k) { return map[k]; });
  }

  function refreshCaseNumberPicker() {
    var select = document.getElementById("caseNumberPicker");
    var summaries = getCaseSummaries();
    select.innerHTML = '<option value="">직접 입력 (신규 사건)</option>';
    summaries.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.caseNumber;
      opt.textContent = formatCaseLabel(s);
      select.appendChild(opt);
    });
  }

  // ---------- 추가/수정 모달 ----------
  function openFormModal(opts) {
    opts = opts || {};
    var form = document.getElementById("eventForm");
    form.reset();
    document.getElementById("eventId").value = "";
    document.getElementById("deleteBtn").style.display = "none";
    clearDateRows();
    refreshCaseNumberPicker();
    document.getElementById("caseNumberPickerField").style.display = opts.editId ? "none" : "";

    if (opts.editId) {
      var ev = state.events.find(function (e) { return e.id === opts.editId; });
      if (ev) {
        document.getElementById("formTitle").textContent = "일정 수정";
        document.getElementById("eventId").value = ev.id;
        document.getElementById("caseNumber").value = formatCaseLabel(ev);
        document.getElementById("eventType").value = ev.type;
        document.getElementById("courtName").value = ev.court || "";
        document.getElementById("memo").value = ev.memo || "";
        document.getElementById("deleteBtn").style.display = "inline-block";
        document.getElementById("addDateRowBtn").style.display = "none";
        addDateRow(ev.date, ev.time);
      }
    } else {
      document.getElementById("formTitle").textContent = "일정 추가";
      document.getElementById("caseNumber").value = opts.caseNumber || "";
      document.getElementById("eventType").value = opts.type || "";
      document.getElementById("courtName").value = opts.court || "";
      document.getElementById("caseNumberPicker").value = opts.caseNumber || "";
      document.getElementById("addDateRowBtn").style.display = "inline-block";
      addDateRow(opts.date || todayStr(), "");
    }
    updateRemoveButtonsVisibility();
    document.getElementById("modalOverlay").classList.add("open");
  }
  function closeFormModal() { document.getElementById("modalOverlay").classList.remove("open"); }

  async function submitForm(e) {
    e.preventDefault();
    var id = document.getElementById("eventId").value;
    var base = {
      caseNumber: document.getElementById("caseNumber").value.trim(),
      caseTitle: "",
      type: document.getElementById("eventType").value.trim(),
      court: document.getElementById("courtName").value.trim(),
      memo: document.getElementById("memo").value.trim(),
    };
    if (!base.caseNumber || !base.type) return;
    var rows = collectDateRows();
    if (rows.length === 0) return;

    var saveBtn = document.getElementById("eventForm").querySelector('button[type="submit"]');
    saveBtn.disabled = true;

    var res;
    if (id) {
      var patch = eventToRow(Object.assign({}, base, { date: rows[0].date, time: rows[0].time }));
      res = await sb.from("events").update(patch).eq("id", id);
    } else {
      var payload = rows.map(function (r) {
        return eventToRow(Object.assign({}, base, { date: r.date, time: r.time, done: false }));
      });
      res = await sb.from("events").insert(payload);
    }

    saveBtn.disabled = false;
    if (res.error) {
      alert("저장 실패: " + res.error.message);
      return;
    }
    closeFormModal();
    await refreshEventsFromServer();
  }

  async function deleteCurrentEvent() {
    var id = document.getElementById("eventId").value;
    if (!id) return;
    if (!confirm("이 일정을 삭제할까요?")) return;
    var res = await sb.from("events").delete().eq("id", id);
    if (res.error) {
      alert("삭제 실패: " + res.error.message);
      return;
    }
    closeFormModal();
    await refreshEventsFromServer();
  }

  function renderStats() {
    var pending = state.events.filter(function (e) { return !e.done; });
    var today = todayStr();
    var todayCount = pending.filter(function (e) { return e.date === today; }).length;
    var weekCount = pending.filter(function (e) {
      var diff = diffDaysFromToday(e.date);
      return diff >= 0 && diff <= 7;
    }).length;
    var overdueCount = pending.filter(function (e) { return diffDaysFromToday(e.date) < 0; }).length;
    var caseSet = {};
    pending.forEach(function (e) { if (e.caseNumber) caseSet[e.caseNumber] = true; });

    document.getElementById("statTotal").textContent = pending.length;
    document.getElementById("statToday").textContent = todayCount;
    document.getElementById("statWeek").textContent = weekCount;
    document.getElementById("statOverdue").textContent = overdueCount;
    document.getElementById("statCases").textContent = Object.keys(caseSet).length;
    updateStatTileActiveClasses();
  }

  function renderAll() {
    renderStats();
    renderUrgentList();
    renderCalendar();
    if (state.activeView === "case") renderCaseView();
  }

  // ---------- 로그인 ----------
  var realtimeChannel = null;

  function showAuthMsg(text, kind) {
    var el = document.getElementById("authMsg");
    el.textContent = text;
    el.className = "auth-msg " + (kind || "error");
  }
  function clearAuthMsg() {
    var el = document.getElementById("authMsg");
    el.textContent = "";
    el.className = "auth-msg";
  }

  async function onSignedIn(user) {
    state.currentUser = user;
    document.getElementById("authOverlay").classList.remove("open");
    document.getElementById("appRoot").style.display = "";
    document.getElementById("userEmailLabel").textContent = user.email || "";
    await refreshEventsFromServer();
    refreshNaverStatus();
    if (!realtimeChannel) {
      realtimeChannel = sb
        .channel("events-sync")
        .on("postgres_changes", { event: "*", schema: "public", table: "events" }, function () {
          refreshEventsFromServer();
        })
        .subscribe();
    }
  }

  function onSignedOut() {
    state.currentUser = null;
    state.events = [];
    if (realtimeChannel) {
      sb.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    document.getElementById("appRoot").style.display = "none";
    document.getElementById("authOverlay").classList.add("open");
  }

  async function initAuth() {
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (session) onSignedIn(session.user);
    else onSignedOut();

    sb.auth.onAuthStateChange(function (event, session) {
      if (session) onSignedIn(session.user);
      else onSignedOut();
    });
  }

  function wireAuthUI() {
    document.getElementById("authLoginBtn").addEventListener("click", async function () {
      clearAuthMsg();
      var email = document.getElementById("authEmail").value.trim();
      var password = document.getElementById("authPassword").value;
      if (!email || !password) { showAuthMsg("이메일과 비밀번호를 입력해주세요."); return; }
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error) showAuthMsg(res.error.message);
    });

    document.getElementById("authSignupBtn").addEventListener("click", async function () {
      clearAuthMsg();
      var email = document.getElementById("authEmail").value.trim();
      var password = document.getElementById("authPassword").value;
      if (!email || !password) { showAuthMsg("이메일과 비밀번호를 입력해주세요."); return; }
      if (password.length < 6) { showAuthMsg("비밀번호는 6자 이상이어야 합니다."); return; }
      var res = await sb.auth.signUp({ email: email, password: password });
      if (res.error) { showAuthMsg(res.error.message); return; }
      if (res.data && res.data.session) return; // 이메일 확인이 꺼져 있으면 바로 로그인됨
      showAuthMsg("가입 확인 이메일을 보냈습니다. 메일함을 확인한 뒤 로그인해주세요.", "info");
    });

    document.getElementById("logoutBtn").addEventListener("click", function () { sb.auth.signOut(); });

    document.getElementById("naverConnectBtn").addEventListener("click", async function () {
      if (this.dataset.connected) {
        if (!confirm("네이버 캘린더 연동을 해제할까요?")) return;
        await sb.functions.invoke("super-endpoint", { body: { action: "disconnect" } });
        updateNaverConnectBtn(false);
      } else {
        startNaverConnect();
      }
    });

    window.addEventListener("message", async function (e) {
      if (e.origin !== window.location.origin) return;
      if (!e.data || e.data.source !== "naver-oauth") return;
      if (e.data.error) { alert("네이버 캘린더 연동이 취소되었습니다."); return; }
      var savedState = sessionStorage.getItem("naverOAuthState");
      if (!e.data.state || e.data.state !== savedState) {
        alert("보안 검증에 실패했습니다. 다시 시도해주세요.");
        return;
      }
      sessionStorage.removeItem("naverOAuthState");
      var res = await sb.functions.invoke("super-endpoint", {
        body: { action: "exchange", code: e.data.code, state: e.data.state },
      });
      if (res.error || (res.data && res.data.error)) {
        var msg = (res.data && res.data.error) || (res.error && res.error.message) || "알 수 없는 오류";
        alert("네이버 캘린더 연동 실패: " + msg);
        return;
      }
      updateNaverConnectBtn(true);
      alert("네이버 캘린더 연결이 완료되었습니다.");
    });
  }

  // ---------- 초기화 ----------
  function init() {
    var now = new Date();
    state.calYear = now.getFullYear();
    state.calMonth = now.getMonth();

    renderTodayLabel();
    renderCalDow();
    wireAuthUI();
    initAuth();

    document.getElementById("addBtn").addEventListener("click", function () { openFormModal({}); });
    document.getElementById("cancelBtn").addEventListener("click", closeFormModal);
    document.getElementById("modalOverlay").addEventListener("click", function (e) { if (e.target === this) closeFormModal(); });
    document.getElementById("eventForm").addEventListener("submit", submitForm);
    document.getElementById("deleteBtn").addEventListener("click", deleteCurrentEvent);
    document.getElementById("addDateRowBtn").addEventListener("click", function () { addDateRow("", ""); });
    document.getElementById("caseNumberPicker").addEventListener("change", function () {
      if (!this.value) return;
      var summary = getCaseSummaries().find(function (s) { return s.caseNumber === this.value; }, this);
      if (!summary) return;
      document.getElementById("caseNumber").value = formatCaseLabel(summary);
      if (summary.court) document.getElementById("courtName").value = summary.court;
    });

    document.getElementById("prevMonth").addEventListener("click", function () { changeMonth(-1); });
    document.getElementById("nextMonth").addEventListener("click", function () { changeMonth(1); });
    document.getElementById("todayBtn").addEventListener("click", function () {
      var n = new Date();
      state.calYear = n.getFullYear();
      state.calMonth = n.getMonth();
      renderCalendar();
    });

    document.getElementById("showDoneToggle").addEventListener("change", function () {
      state.showDone = this.checked;
      renderUrgentList();
    });

    document.getElementById("urgentFilterBadge").addEventListener("click", function () { setUrgentFilter("all"); });
    document.getElementById("statTileTotal").addEventListener("click", function () { setUrgentFilter("all"); });
    document.getElementById("statTileToday").addEventListener("click", function () { setUrgentFilter("today"); });
    document.getElementById("statTileWeek").addEventListener("click", function () { setUrgentFilter("week"); });
    document.getElementById("statTileOverdue").addEventListener("click", function () { setUrgentFilter("overdue"); });
    document.getElementById("statTileCases").addEventListener("click", function () {
      switchView("case");
      document.getElementById("caseGroupList").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    document.getElementById("tabCalendar").addEventListener("click", function () { switchView("calendar"); });
    document.getElementById("tabByCase").addEventListener("click", function () { switchView("case"); });
    document.getElementById("caseSearchInput").addEventListener("input", renderCaseView);
    document.getElementById("toggleAllCasesBtn").addEventListener("click", function () {
      var keys = getFilteredCaseGroups().keys;
      var anyExpanded = keys.some(function (k) { return !state.collapsedCases[k]; });
      keys.forEach(function (k) { state.collapsedCases[k] = anyExpanded; });
      renderCaseView();
    });

    document.getElementById("dayModalClose").addEventListener("click", closeDayModal);
    document.getElementById("dayModalOverlay").addEventListener("click", function (e) { if (e.target === this) closeDayModal(); });
    document.getElementById("dayModalAdd").addEventListener("click", function () {
      var d = state.dayModalDate;
      closeDayModal();
      openFormModal({ date: d });
    });
  }

  document.addEventListener("DOMContentLoaded", init);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
